<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景：渐变深蓝（男足主题色） -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <radialGradient id="ball" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e5e7eb"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形（移动端圆角图标） -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  
  <!-- 报纸：底部大白色矩形 -->
  <g transform="translate(56, 164)">
    <rect x="0" y="0" width="400" height="292" rx="18" ry="18" fill="#ffffff"/>
    <rect x="0" y="0" width="400" height="56" rx="18" ry="18" fill="url(#accent)"/>
    <!-- 报纸标题"FT" -->
    <text x="24" y="42" font-family="-apple-system, 'SF Pro Display', sans-serif" font-size="36" font-weight="900" fill="#fff" letter-spacing="-1">FT</text>
    <text x="108" y="42" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="26" font-weight="700" fill="#fff">早知道</text>
    <!-- 报纸分割线+内容（假文字） -->
    <line x1="16" y1="84" x2="384" y2="84" stroke="#cbd5e1" stroke-width="2"/>
    <g fill="#475569">
      <rect x="16" y="104" width="248" height="14" rx="4"/>
      <rect x="16" y="130" width="368" height="10" rx="4"/>
      <rect x="16" y="148" width="336" height="10" rx="4"/>
      <rect x="16" y="166" width="304" height="10" rx="4"/>
      <rect x="16" y="200" width="180" height="54" rx="10" fill="#dbeafe"/>
      <rect x="204" y="200" width="192" height="54" rx="10" fill="#fef3c7"/>
      <rect x="16" y="264" width="368" height="12" rx="4"/>
    </g>
  </g>
  
  <!-- 足球：右上角，部分压在报纸外面 -->
  <g transform="translate(332, 78)" filter="url(#glow)">
    <circle cx="0" cy="0" r="88" fill="url(#ball)" stroke="#94a3b8" stroke-width="2"/>
    <!-- 足球五边形花纹 -->
    <g fill="#0f172a">
      <polygon points="0,-56 26,-18 46,-46 16,-70 -16,-70 -46,-46 -26,-18"/>
      <polygon points="-84,-14 -56,-46 -74,4"/>
      <polygon points="84,-14 56,-46 74,4"/>
      <polygon points="-46,46 -74,4 -26,18 -16,70"/>
      <polygon points="46,46 74,4 26,18 16,70"/>
      <polygon points="0,88 16,70 -16,70 -26,18 26,18"/>
    </g>
  </g>
  
  <!-- 🔥红点指示器（新鲜/更新） -->
  <circle cx="416" cy="96" r="22" fill="#ef4444" stroke="#fff" stroke-width="5"/>
  
  <!-- 日期标签（右下角） -->
  <g transform="translate(344, 428)" opacity="0.92">
    <rect x="0" y="0" width="120" height="48" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="60" y="32" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" fill="#fbbf24">9:00</text>
  </g>
</svg>
