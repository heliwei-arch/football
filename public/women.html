<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>📰 FT早知道 · 女足日报</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fce7f3">
<script>
// 统一入口：女足版直接跳转到 index.html#women，避免两份 HTML 维护不同步
(function(){
  var hash = location.hash || '';
  var search = location.search || '';
  // 保留 hash（如 #date=2026-08-11）和 query 参数
  var target = './index.html#women' + (hash && hash !== '#women' ? hash.replace(/^#women&?/, '&') : '');
  // 如果已经有 #women 前缀，就用原来的 hash
  if (hash.indexOf('#women') === 0) {
    target = './index.html' + hash;
  }
  location.replace(target);
})();
</script>
</head>
<body style="margin:0;padding:40px 20px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fdf2f8;color:#831843;text-align:center;">

<p style="font-size:14px;opacity:0.7;">如果没有自动跳转，请<a href="./index.html#women" style="color:#be185d;">点此进入</a></p>
</body>
</html>
