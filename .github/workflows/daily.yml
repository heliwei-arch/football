name: 足球日报每日构建 (GitHub Pages)

# 触发规则：
# 1) 手动触发（workflow_dispatch）：立即跑一次，用于首次部署或手动刷新
# 2) 定时：每天 UTC 1:00 = 北京时间 9:00（早间推送）
# 3) push main分支：部署配置变更时立即构建
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # UTC 1:00 = Asia/Shanghai 9:00（注意夏令时不影响北京时间）
  push:
    branches: [main]
    paths:
      - 'generate_static.py'
      - 'crawl_dongqiudi.py'
      - 'public/**'
      - '.github/workflows/**'

# GitHub Pages 官方 OIDC 部署权限（必须）
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多个 workflow 同时部署 Pages
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: 构建懂球帝数据 + 部署 GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11（纯stdlib，无需pip依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # ============== 关键：跨 run 持久化 30 天推送历史 ==============
      # GitHub Actions runner 每次都是干净的，没有本地 cache.json
      # 所以每次构建前先下载当前 Pages 上已发布的 push-history*.json 作为旧历史，
      # 再传给 generate_static.py 合并（最新一条 + 旧29条 = 30天滚动）
      - name: 下载已发布的 30 天推送历史（若存在）
        id: fetch_history
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set +e
          mkdir -p /tmp/old_history
          MEN_URL="${PAGES_URL}/data/push-history.json"
          WOMEN_URL="${PAGES_URL}/data/push-history-women.json"
          echo "男足历史URL: $MEN_URL"
          echo "女足历史URL: $WOMEN_URL"
          curl -sSL --max-time 15 --fail "$MEN_URL" -o /tmp/old_history/push-history.json 2>&1 && echo "✅ 男足历史下载成功 ($(wc -c </tmp/old_history/push-history.json) B)" || echo "⚠️ 男足历史暂不可用（首次部署会这样）"
          curl -sSL --max-time 15 --fail "$WOMEN_URL" -o /tmp/old_history/push-history-women.json 2>&1 && echo "✅ 女足历史下载成功 ($(wc -c </tmp/old_history/push-history-women.json) B)" || echo "⚠️ 女足历史暂不可用"
          echo "OLD_PUSH_HISTORY_URL=$MEN_URL" >> $GITHUB_ENV
          echo "OLD_PUSH_HISTORY_WOMEN_URL=$WOMEN_URL" >> $GITHUB_ENV
          # 如果下载成功，把它们伪装成本地 cache.json 给 generate_static.py 兜底
          if [ -s /tmp/old_history/push-history.json ] || [ -s /tmp/old_history/push-history-women.json ]; then
            python3 - <<'PY'
            import json, os
            hist_men = []
            hist_women = []
            p1 = "/tmp/old_history/push-history.json"
            p2 = "/tmp/old_history/push-history-women.json"
            if os.path.exists(p1):
                d = json.load(open(p1, "r", encoding="utf-8"))
                hist_men = d.get("history", []) if isinstance(d, dict) else (d if isinstance(d, list) else [])
            if os.path.exists(p2):
                d = json.load(open(p2, "r", encoding="utf-8"))
                hist_women = d.get("history", []) if isinstance(d, dict) else (d if isinstance(d, list) else [])
            json.dump({"pushHistory": hist_men, "pushHistoryWomen": hist_women},
                      open("cache.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
            print(f"✅ cache.json 已生成 男足{len(hist_men)}条 / 女足{len(hist_women)}条")
            PY
          else
            echo "首次部署无历史：跳过 cache.json 生成"
          fi
          set -e

      - name: 构建静态页面 + 懂球帝真实数据（每天9点）
        id: build
        run: |
          echo "--- 开始构建 (北京时间 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')) ---"
          python3 generate_static.py
          echo "--- 构建完成，产物清单 ---"
          ls -lh public/*.html public/data/*.json || true

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出最终分享链接
        run: |
          echo ""
          echo "=================================================================="
          echo "✅ 部署成功！对外可分享链接（非字节同事也能直接打开）："
          echo ""
          echo "  男足日报首页  →  ${{ steps.deployment.outputs.page_url }}"
          echo "  女足独立页面  →  ${{ steps.deployment.outputs.page_url }}women.html"
          echo ""
          echo "每天早上 9:00 (北京时间) 自动拉取懂球帝最新数据并重新部署 ✅"
          echo "手动更新：进入仓库的 Actions → 本Workflow → Run workflow（立即触发）"
          echo "=================================================================="
